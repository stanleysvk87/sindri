server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        # The backend keys its login lockout on the client address, and
        # every request here arrives from THIS container. It only trusts
        # these headers from a proxy listed in SINDRI_TRUSTED_PROXIES
        # (see docker-compose.yml) -- without that the lockout is global
        # instead of per-IP, and anyone on the LAN can lock the owner out.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA fallback -- client-side routing (react-router) owns everything
    # that isn't /api or a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
